[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Tests read the shared commitment vectors; deploy scripts write contract addresses.
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../results" },
]

# Invariant fuzzing: a quick campaign on every `forge test`; `npm run fuzz` uses the long profile below.
[invariant]
runs = 64
depth = 100
fail_on_revert = false

[profile.long.invariant]
runs = 1000
depth = 300
fail_on_revert = false

[fmt]
line_length = 110

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
