[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Tests read proof fixtures generated by the circuit scripts; deploy scripts write contract addresses.
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "../deployments" },
]

[fmt]
line_length = 110
# Verifiers are generated by snarkjs; never reformat them by hand.
ignore = ["test/spikes/SpikeVerifier.sol", "src/zk/*Verifier.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
